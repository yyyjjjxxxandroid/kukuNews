plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
}
//一定写到plugins的后面
//引入上层目录的common.gradle文件
apply from: '../common.gradle'
android {
    namespace 'com.ixuea.courses.mymusic'


    defaultConfig {
        applicationId "com.ixuea.courses.mymusic"


        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
    viewBinding {
        enabled=true
    }
}

dependencies {
     //腾讯开源的高性能keyValue存储，用来替代系统的SharedPreferences
    //https://github.com/Tencent/MMKV
    implementation 'com.tencent:mmkv-static:1.2.16'
    //权限框架
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    //UI框架
    implementation 'com.qmuiteam:qmui:2.1.0'
    //引用模块 :代表News根目录
    implementation project(":super-k")
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout

}