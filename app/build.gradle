plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
}
//一定写到plugins的后面
//引入上层目录的common.gradle文件
apply from: '../common.gradle'
android {
    namespace 'com.ixuea.courses.mymusic'


    defaultConfig {
        applicationId "com.ixuea.courses.mymusic"


        versionCode 1
        versionName "1.0"
        //渠道相关
        flavorDimensions "versionCode"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
    viewBinding {
        enabled = true
    }
    productFlavors {
        //开发环境
        dev {
            //API端点
            buildConfigField('String', "ENDPOINT", '"https://news-api-course.ixuea.com/"')

            //资源端点
            buildConfigField 'String', 'RESOURCE_ENDPOINT', '"https://rs.ixuea.com/music/%s"'

            dimension = minSdkVersion
        }

        //本地开发环境
        local {
            //API端点
            buildConfigField('String', "ENDPOINT", '"http://192.168.2.108:8080/"')

            //如果局域网ip不行，用这个试试
//            buildConfigField('String', "ENDPOINT", '"http://10.0.2.2:8080/"')

            //资源端点
//            buildConfigField 'String', 'RESOURCE_ENDPOINT', '"http://course-music-dev.ixuea.com/%s"'

            //新资源地址
            buildConfigField 'String', 'RESOURCE_ENDPOINT', '"https://rs.ixuea.com/music/%s"'

            dimension = minSdkVersion
        }

        //正式环境
        prod {
            //API端点
            buildConfigField 'String', 'ENDPOINT', '"https://news-api-prod-course.ixuea.com/"'

            //资源端点
            buildConfigField 'String', 'RESOURCE_ENDPOINT', '"https://rs.ixuea.com/music/%s"'

            dimension = minSdkVersion
        }
    }
}

dependencies {
    //region 下拉刷新，上来加载更多
    //下拉刷新框架
    //https://github.com/scwang90/SmartRefreshLayout
    implementation 'io.github.scwang90:refresh-layout-kernel:2.0.5'
    implementation 'io.github.scwang90:refresh-header-classics:2.0.5'     //经典刷新头
    implementation 'io.github.scwang90:refresh-footer-classics:2.0.5'    //经典加载头
    //endregion

    //类似微信图片预览框架
    //https://github.com/wanglu1209/PhotoViewer
    implementation 'com.github.wanglu1209:PhotoViewer:0.50'

    //通过OkHttp的拦截器机制
    //实现在应用通知栏显示网络请求功能
    //https://github.com/ChuckerTeam/chucker
    //调试模式下
    debugImplementation "com.github.chuckerteam.chucker:library:3.5.2"
    //打包模式时release（发行、发布；释放；解脱）
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:3.5.2"

    //集合工具类
    // https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation 'org.apache.commons:commons-collections4:4.4'


    //更方便的日期时间，运算，解析格式化框架
    //https://www.joda.org/joda-time/index.html
    implementation 'joda-time:joda-time:2.12.2'

    //图片加载框架，还引用他目的是，coil图片加载框架
    //https://github.com/bumptech/glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    //apache common lang3工具包
    //提供了StringUtils等这样的类
    //http://commons.apache.org/proper/commons-lang/
    implementation 'org.apache.commons:commons-lang3:3.8'

    //封装了RecyclerView
    //提供更高层次的接口
    //https://github.com/CymChad/BaseRecyclerViewAdapterHelper
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper:4.0.0-beta04"

    //类似TabLayout的控件
    //https://github.com/angcyo/DslTabLayout
    implementation 'com.github.angcyo.DslTablayout:TabLayout:3.5.3'
    implementation 'com.github.angcyo.DslTablayout:ViewPager2Delegate:3.5.3'

    implementation libs.androidx.lifecycle.lifecycle.livedata.ktx4
    implementation libs.androidx.lifecycle.viewmodel.android
    //region 请求网络相关
    //提示：region这种语法是最新的，推荐使用这种，也更容易阅读，不建议在同一个文件同时使用
    //因为可能会显示出错
    //okhttp
    //https://github.com/square/okhttp
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    //用来打印okhttp请求日志
    //当然也可以自定义
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.3"

   //retrofit
   //https://github.com/square/retrofit
    implementation libs.retrofit2.retrofit

   //使用gson解析json
    //https://github.com/google/gson
    implementation 'com.google.code.gson:gson:2.10.1'

   //适配retrofit使用gson解析
//版本要和retrofit一样
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
//endregion

//    * 左右滚动的引导界面 如果想实现更复杂的效果，例如：滚动时文本缩放等效果，可以使用类似这样的框架：
//    * https://github.com/bingoogolapple/BGABanner-Android
    //圆形指示器
    //https://github.com/ongakuer/CircleIndicator
    implementation 'me.relex:circleindicator:2.1.6'
    //腾讯开源的高性能keyValue存储，用来替代系统的SharedPreferences
    //https://github.com/Tencent/MMKV
    implementation 'com.tencent:mmkv-static:1.2.16'
    //权限框架
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    //UI框架
    implementation 'com.qmuiteam:qmui:2.1.0'
    //引用模块 :代表News根目录
    implementation project(":super-k")
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.appcompat

}